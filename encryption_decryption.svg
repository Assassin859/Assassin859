<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220">
  <style>
    .s0, .p0, .r0,
    .s1, .p1, .r1,
    .s2, .p2, .r2,
    .s3, .p3, .r3 { opacity: 0; }

    /* ── LINE 0 ── */
    .s0 { animation: show 12s 0s infinite; }
    .p0 { animation: show 12s -10s infinite; }
    .r0 { animation: show 12s -8s infinite; }

    /* ── LINE 1 ── */
    .s1 { animation: show 12s -11s infinite; }
    .p1 { animation: show 12s -9s infinite; }
    .r1 { animation: show 12s -7s infinite; }

    /* ── LINE 2 ── */
    .s2 { animation: show 12s -10.5s infinite; }
    .p2 { animation: show 12s -8.5s infinite; }
    .r2 { animation: show 12s -6.5s infinite; }

    /* ── LINE 3 ── */
    .s3 { animation: show 12s -10s infinite; }
    .p3 { animation: show 12s -8s infinite; }
    .r3 { animation: show 12s -6s infinite; }

    @keyframes show {
      0%   { opacity: 1; }
      15%  { opacity: 1; }
      20%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .scrambled { fill: #EF4444; font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 1px; }
    .partial   { fill: #F59E0B; font-family: 'Courier New', monospace; font-size: 15px; letter-spacing: 1px; }
    .revealed  { fill: #38BDF8; font-family: 'Share Tech Mono','Courier New', monospace; font-size: 15px; letter-spacing: 1px; }
    .cursor    { fill: #38BDF8; animation: blink 0.8s step-end infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0;} }
  </style>

  <!-- Background -->
  <rect width="800" height="220" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header bar -->
  <rect width="800" height="32" rx="12" fill="#161B22"/>
  <rect y="20" width="800" height="12" fill="#161B22"/>
  <circle cx="18" cy="16" r="5" fill="#EF4444"/>
  <circle cx="36" cy="16" r="5" fill="#F59E0B"/>
  <circle cx="54" cy="16" r="5" fill="#10B981"/>
  <text x="400" y="20" text-anchor="middle" font-family="'Courier New',monospace" font-size="11" fill="#8B949E">DECRYPTION ENGINE // AES-256-CBC</text>

  <!-- ── ROW 0 ── -->
  <text x="30" y="80">
    <tspan class="scrambled s0">hUxYkVeTyUiDeN@!# --&gt; ??????????????????</tspan>
    <tspan class="partial   p0">Hi#_ I'm M##treya G##kwad 👋 ___________</tspan>
    <tspan class="revealed  r0">Hi, I'm Maitreya Gaikwad 👋</tspan>
  </text>

  <!-- ── ROW 1 ── -->
  <text x="30" y="115">
    <tspan class="scrambled s1">bL0cKcH@!n#&amp;W3b#D3v!@#$ --&gt; ????????</tspan>
    <tspan class="partial   p1">Bl##kchain &amp; W##3 D##eloper __________</tspan>
    <tspan class="revealed  r1">Blockchain &amp; Web3 Developer</tspan>
  </text>

  <!-- ── ROW 2 ── -->
  <text x="30" y="150">
    <tspan class="scrambled s2">5m@Rt#C0Ntr@cT5|D3F!|S0L@n@ --&gt; ????????</tspan>
    <tspan class="partial   p2">Sm##t Contr##ts | D##i | Sol##a _______</tspan>
    <tspan class="revealed  r2">Smart Contracts | DeFi | Solana</tspan>
  </text>

  <!-- ── ROW 3 ── -->
  <text x="30" y="185">
    <tspan class="scrambled s3">bU!Ld!nG#pR0DuCtI0n#Gr@D3#W3B3 --&gt; ?????</tspan>
    <tspan class="partial   p3">Bu##ding prod##tion-gr##e W##3 sys##ms _</tspan>
    <tspan class="revealed  r3">Building production-grade Web3 systems</tspan>
  </text>

  <!-- blinking cursor -->
  <text x="600" y="185" class="cursor" font-family="'Courier New',monospace" font-size="15px">▋</text>
</svg>
