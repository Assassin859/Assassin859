<svg xmlns="http://www.w3.org/2000/svg" width="360" height="480" viewBox="0 0 360 480">
  <defs>
    <linearGradient id="meta-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1E2F" />
      <stop offset="100%" stop-color="#0F0F16" />
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8F1C" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>
    <linearGradient id="btn-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#037DD6" />
      <stop offset="100%" stop-color="#1098FC" />
    </linearGradient>
    <clipPath id="circle-clip">
      <circle cx="28" cy="28" r="16" />
    </clipPath>
  </defs>

  <!-- Outer container with MetaMask-like border and shadow -->
  <rect width="360" height="480" rx="16" fill="url(#meta-bg)" stroke="#2C2C3E" stroke-width="2" />

  <!-- Top Navigation Bar -->
  <g id="navbar" transform="translate(0, 0)">
    <!-- Network Selector -->
    <rect x="15" y="15" width="160" height="32" rx="16" fill="#242435" stroke="#38384F" stroke-width="1" />
    <circle cx="30" cy="31" r="5" fill="#10B981" /> <!-- Green status indicator -->
    <text x="42" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#E2E8F0" font-weight="500">Multi-Chain Web3</text>
    
    <!-- Account Info / Avatar -->
    <circle cx="325" cy="31" r="16" fill="#FF8F1C" />
    <text x="325" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M</text>
  </g>

  <!-- Wallet Header Info -->
  <g transform="translate(0, 60)">
    <!-- Fox Logo Silhouette / Decorative Web3 Icon -->
    <path d="M 180 10 L 145 35 L 158 70 L 180 58 L 202 70 L 215 35 Z" fill="url(#orange-glow)" opacity="0.9" />
    <path d="M 180 10 L 158 31 L 180 40 L 202 31 Z" fill="#FFA347" />
    <path d="M 180 58 L 158 70 L 180 78 L 202 70 Z" fill="#D45500" />
    
    <!-- Account Name -->
    <text x="180" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Account 1</text>
    
    <!-- Address Badge -->
    <g transform="translate(105, 112)">
      <rect width="150" height="22" rx="11" fill="#242435" />
      <text x="75" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">0xAssassin859...9b35</text>
    </g>
  </g>

  <!-- Balance -->
  <g transform="translate(0, 215)">
    <text x="180" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" fill="#FFFFFF" font-weight="bold" text-anchor="middle">1,601 WEI</text>
    <text x="180" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94A3B8" text-anchor="middle">$2,001.25 USD (OS Commits)</text>
  </g>

  <!-- Action Buttons (Send, Swap, Bridge) -->
  <g transform="translate(60, 265)">
    <!-- Send Button -->
    <g transform="translate(0, 0)">
      <circle cx="30" cy="20" r="18" fill="#037DD6" />
      <path d="M 25 22 L 35 16 L 35 24 L 30 20 L 25 22" fill="#FFFFFF" />
      <text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#037DD6" font-weight="500" text-anchor="middle">Send</text>
    </g>
    <!-- Swap Button -->
    <g transform="translate(90, 0)">
      <circle cx="30" cy="20" r="18" fill="#037DD6" />
      <path d="M 25 17 L 35 17 L 31 13 M 35 23 L 25 23 L 29 27" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#037DD6" font-weight="500" text-anchor="middle">Swap</text>
    </g>
    <!-- Bridge Button -->
    <g transform="translate(180, 0)">
      <circle cx="30" cy="20" r="18" fill="#037DD6" />
      <path d="M 23 20 L 37 20 M 31 15 L 37 20 L 31 25" stroke="#FFFFFF" stroke-width="2" fill="none" />
      <text x="30" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#037DD6" font-weight="500" text-anchor="middle">Bridge</text>
    </g>
  </g>

  <!-- Asset List -->
  <g transform="translate(20, 355)">
    <!-- Tabs Header -->
    <text x="10" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Assets</text>
    <line x1="0" y1="10" x2="320" y2="10" stroke="#2C2C3E" stroke-width="1.5" />
    <line x1="5" y1="10" x2="60" y2="10" stroke="#037DD6" stroke-width="2" />

    <!-- Asset 1 (Solidity contracts) -->
    <g transform="translate(0, 20)">
      <circle cx="20" cy="15" r="14" fill="#3C3C3D" />
      <text x="20" y="19" font-family="Courier New, monospace" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Ξ</text>
      <text x="45" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Solidity / EVM</text>
      <text x="45" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Pharbit + Atheon</text>
      <text x="310" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="end">1,135 Lines</text>
    </g>

    <!-- Asset 2 (Solana Adapters) -->
    <g transform="translate(0, 60)">
      <circle cx="20" cy="15" r="14" fill="#9945FF" />
      <text x="20" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SOL</text>
      <text x="45" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Solana Dev</text>
      <text x="45" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">KeeperHub Adapter</text>
      <text x="310" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold" text-anchor="end">3,312 Lines</text>
    </g>
  </g>
</svg>
