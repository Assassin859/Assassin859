<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240">
  <style>
    /* ── Matrix rain ── */
    @keyframes fall {
      0%   { transform: translateY(-20px); opacity: 0; }
      10%  { opacity: 0.85; }
      85%  { opacity: 0.4; }
      100% { transform: translateY(250px); opacity: 0; }
    }
    .r { font-family: 'Courier New', monospace; font-size: 13px; fill: #00FF41; opacity: 0; }
    .ra { animation: fall linear infinite; }

    /*
      Sequential decode: each line has 3 phases (enc → mid → clr)
      Total cycle = 18s
      Line 0: enc  0-3s,  mid 3-6s,   clr 6-14s,  fade 14-18s
      Line 1: enc  0-5s,  mid 5-8s,   clr 8-14s,  fade 14-18s
      Line 2: enc  0-7s,  mid 7-10s,  clr 10-14s, fade 14-18s
      Line 3: enc  0-9s,  mid 9-12s,  clr 12-14s, fade 14-18s
    */

    /* LINE 0 */
    @keyframes e0 { 0%{opacity:1} 16.6%{opacity:1} 19%{opacity:0} 100%{opacity:0} }
    @keyframes m0 { 0%,16%{opacity:0} 19%{opacity:1} 33%{opacity:1} 36%{opacity:0} 100%{opacity:0} }
    @keyframes c0 { 0%,33%{opacity:0} 36%{opacity:1} 77%{opacity:1} 83%{opacity:0} 100%{opacity:0} }

    /* LINE 1 */
    @keyframes e1 { 0%{opacity:1} 27%{opacity:1} 30%{opacity:0} 100%{opacity:0} }
    @keyframes m1 { 0%,27%{opacity:0} 30%{opacity:1} 44%{opacity:1} 47%{opacity:0} 100%{opacity:0} }
    @keyframes c1 { 0%,44%{opacity:0} 47%{opacity:1} 77%{opacity:1} 83%{opacity:0} 100%{opacity:0} }

    /* LINE 2 */
    @keyframes e2 { 0%{opacity:1} 38%{opacity:1} 41%{opacity:0} 100%{opacity:0} }
    @keyframes m2 { 0%,38%{opacity:0} 41%{opacity:1} 55%{opacity:1} 58%{opacity:0} 100%{opacity:0} }
    @keyframes c2 { 0%,55%{opacity:0} 58%{opacity:1} 77%{opacity:1} 83%{opacity:0} 100%{opacity:0} }

    /* LINE 3 */
    @keyframes e3 { 0%{opacity:1} 50%{opacity:1} 53%{opacity:0} 100%{opacity:0} }
    @keyframes m3 { 0%,50%{opacity:0} 53%{opacity:1} 66%{opacity:1} 69%{opacity:0} 100%{opacity:0} }
    @keyframes c3 { 0%,66%{opacity:0} 69%{opacity:1} 77%{opacity:1} 83%{opacity:0} 100%{opacity:0} }

    .T  { animation-duration: 18s; animation-iteration-count: infinite; opacity: 0; }
    .E0 { animation-name: e0; }  .M0 { animation-name: m0; }  .C0 { animation-name: c0; }
    .E1 { animation-name: e1; }  .M1 { animation-name: m1; }  .C1 { animation-name: c1; }
    .E2 { animation-name: e2; }  .M2 { animation-name: m2; }  .C2 { animation-name: c2; }
    .E3 { animation-name: e3; }  .M3 { animation-name: m3; }  .C3 { animation-name: c3; }

    .enc  { font-family: 'Courier New', monospace; font-size: 17px; fill: #00FF41; }
    .part { font-family: 'Courier New', monospace; font-size: 17px; fill: #86EFAC; }
    .clr  { font-family: 'Share Tech Mono','Courier New',monospace; font-size: 17px; fill: #38BDF8; font-weight: bold; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cur { fill: #00FF41; font-family: 'Courier New',monospace; font-size:16px; animation: blink 0.9s step-end infinite; }
  </style>

  <!-- Background -->
  <rect width="800" height="240" fill="#0D1117"/>

  <!-- ── Matrix rain (sides only, so text center stays readable) ── -->
  <!-- left side -->
  <text class="r ra" x="14"  style="animation-duration:2.0s;animation-delay:0.0s">エ</text>
  <text class="r ra" x="14"  style="animation-duration:2.0s;animation-delay:0.7s">ウ</text>
  <text class="r ra" x="14"  style="animation-duration:2.0s;animation-delay:1.4s">ア</text>
  <text class="r ra" x="44"  style="animation-duration:1.7s;animation-delay:0.3s">サ</text>
  <text class="r ra" x="44"  style="animation-duration:1.7s;animation-delay:1.0s">カ</text>
  <text class="r ra" x="44"  style="animation-duration:1.7s;animation-delay:1.7s">ナ</text>
  <text class="r ra" x="74"  style="animation-duration:2.3s;animation-delay:0.5s">1</text>
  <text class="r ra" x="74"  style="animation-duration:2.3s;animation-delay:1.2s">0</text>
  <text class="r ra" x="74"  style="animation-duration:2.3s;animation-delay:1.9s">1</text>
  <text class="r ra" x="104" style="animation-duration:1.9s;animation-delay:0.8s">マ</text>
  <text class="r ra" x="104" style="animation-duration:1.9s;animation-delay:1.5s">ヤ</text>
  <text class="r ra" x="104" style="animation-duration:1.9s;animation-delay:2.2s">ラ</text>
  <!-- right side -->
  <text class="r ra" x="660" style="animation-duration:2.1s;animation-delay:0.2s">ラ</text>
  <text class="r ra" x="660" style="animation-duration:2.1s;animation-delay:0.9s">ワ</text>
  <text class="r ra" x="660" style="animation-duration:2.1s;animation-delay:1.6s">ヤ</text>
  <text class="r ra" x="700" style="animation-duration:1.8s;animation-delay:0.4s">ア</text>
  <text class="r ra" x="700" style="animation-duration:1.8s;animation-delay:1.1s">サ</text>
  <text class="r ra" x="700" style="animation-duration:1.8s;animation-delay:1.8s">カ</text>
  <text class="r ra" x="735" style="animation-duration:2.2s;animation-delay:0.6s">0</text>
  <text class="r ra" x="735" style="animation-duration:2.2s;animation-delay:1.3s">1</text>
  <text class="r ra" x="735" style="animation-duration:2.2s;animation-delay:2.0s">0</text>
  <text class="r ra" x="768" style="animation-duration:1.6s;animation-delay:0.9s">イ</text>
  <text class="r ra" x="768" style="animation-duration:1.6s;animation-delay:1.6s">カ</text>
  <text class="r ra" x="768" style="animation-duration:1.6s;animation-delay:2.3s">ア</text>

  <!-- ── LINE 0 ── -->
  <text x="400" y="68" text-anchor="middle" class="enc T E0">h#xYkV3tyU!D3N@m4!tR3y4G@!kW@D</text>
  <text x="400" y="68" text-anchor="middle" class="part T M0">Hi, I'm M#itreya G#ikwad 👋</text>
  <text x="400" y="68" text-anchor="middle" class="clr T C0">Hi, I'm Maitreya Gaikwad 👋</text>

  <!-- ── LINE 1 ── -->
  <text x="400" y="108" text-anchor="middle" class="enc T E1">bL0cKcH@!n&amp;W3bD3v3l0p3r#!@$%</text>
  <text x="400" y="108" text-anchor="middle" class="part T M1">Bl#ckchain &amp; W#b3 D#veloper</text>
  <text x="400" y="108" text-anchor="middle" class="clr T C1">Blockchain &amp; Web3 Developer</text>

  <!-- ── LINE 2 ── -->
  <text x="400" y="148" text-anchor="middle" class="enc T E2">5m@RtC0Ntr@cT5D3F!S0L@n@#!$%^</text>
  <text x="400" y="148" text-anchor="middle" class="part T M2">Sm#rt Contr#cts | D#Fi | Sol#na</text>
  <text x="400" y="148" text-anchor="middle" class="clr T C2">Smart Contracts | DeFi | Solana</text>

  <!-- ── LINE 3 ── -->
  <text x="400" y="192" text-anchor="middle" class="enc T E3">bU!LdpR0DGr@D3W3B35y5t3mS#!$%</text>
  <text x="400" y="192" text-anchor="middle" class="part T M3">Bu#lding prod#ction-gr#de W#b3 syst#ms</text>
  <text x="400" y="192" text-anchor="middle" class="clr T C3">Building production-grade Web3 systems</text>

  <!-- blinking cursor -->
  <text x="762" y="222" class="cur">▋</text>
</svg>
